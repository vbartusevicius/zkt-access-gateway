name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Publishes to Docker Hub. Requires two repository secrets:
#   DOCKERHUB_USERNAME — your Docker Hub user/org name
#   DOCKERHUB_TOKEN    — an access token from hub.docker.com
# Published image: <DOCKERHUB_USERNAME>/zkt-access-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Run tests in the image (gate before publish)
        run: |
          docker build --platform linux/amd64 --target test --cache-from type=gha -t zkt-access-gateway:test .
          docker run --rm zkt-access-gateway:test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/zkt-access-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Wine layer is amd64-only. ARM hosts (e.g. Raspberry Pi) run this
          # image through QEMU user-mode emulation, which the compose file declares.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
