[project]
name = "zkt-access-gateway"
version = "1.0.0"
description = "Dockerized Python project bridging pyzkaccess via Wine"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0",
    "paho-mqtt>=2.0.0,<3.0.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.1",
    "pydantic>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Real pyzkaccess models/enums for native (no-Wine) tests; SDK calls
    # themselves are stubbed, classes just need to import.
    "pyzkaccess>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend/wine_script"]
addopts = "-q"
asyncio_mode = "auto"
